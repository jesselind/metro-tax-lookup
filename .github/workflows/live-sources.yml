# Optional health check: curated authority-chain https sources (county/district PDFs).
# Not part of PR/push Playwright CI — third-party hosts must not gate merges.
# Manual workflow_dispatch only (no schedule: some hosts 403 bot/datacenter probes).
# Chromium request-only (no app build).
name: Live source URL health
on:
  workflow_dispatch:

jobs:
  live-sources:
    name: Curated source URL probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe curated source URLs
        run: npm run test:e2e:live-sources
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: live-sources-report
          path: playwright-report/
          retention-days: 14
