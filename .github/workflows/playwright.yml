# Playwright workflow (conventional filename). Also runs TypeScript typecheck, ESLint,
# and Vitest before browser e2e so mislabeled "Playwright failed" logs are not
# build/type/lint errors.
# Runs on push/PR to main and via workflow_dispatch.
# Excludes @live-sources (see live-sources.yml) — third-party URL probes do not gate PRs.
name: Playwright
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (next typegen + tsc; includes *.test.ts)
        run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npm run ci:test:unit

  python:
    name: Python unit tests (ingest + parcel-index)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Install Python test deps
        run: python3 -m pip install rapidfuzz
      - name: Ingest tests (classifier, reader, compare, situs contract)
        run: npm run ci:test:ingest
      - name: Parcel index tests
        run: npm run ci:test:parcel-index

  e2e:
    name: Browser e2e (Playwright)
    needs: [typecheck, lint, unit, python]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build (bundle + Next.js typecheck)
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
