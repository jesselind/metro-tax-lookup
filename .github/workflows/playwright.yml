# Phase 6b: enable automatic runs when the e2e smoke suite exists
# (baseURL + webServer + tests under e2e/). Until then keep the workflow
# checked in but gated so PRs into main do not fail on an empty scaffold.
name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    # Automatic push/PR gated until Phase 6b ships browser smoke + critical flows.
    # workflow_dispatch still runs (Actions → Playwright Tests → Run workflow).
    # Change to `if: true` (or delete this line) when the suite is ready.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
